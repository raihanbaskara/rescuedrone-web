<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RescueDrone - Portal Admin SAR Login</title>
<!-- Google Fonts: Inter, Playfair Display, Space Grotesk -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,400;1,500;1,600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: 'Inter', sans-serif; 
    background: #0b0f17; 
    background-image: radial-gradient(circle at 50% 30%, rgba(255,102,0,0.12) 0%, rgba(11,15,23,0) 70%), url('/static/drone_dark.jpg');
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    color: #f8fafc; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    min-height: 100vh; 
    padding: 20px;
    -webkit-font-smoothing: antialiased;
  }
  
  .font-playfair { font-family: 'Playfair Display', serif; }

  .login-card {
    background: rgba(15, 23, 42, 0.85); 
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.18); 
    border-radius: 24px; 
    padding: 40px 36px; 
    width: 100%; 
    max-width: 420px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6); 
    text-align: center;
  }

  .brand-icon {
    width: 44px; height: 44px; border-radius: 12px; background: #ff6600; color: #fff; display: inline-flex;
    align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 0 24px rgba(255,102,0,0.4);
  }
  .brand-icon svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.5; }

  .title-wrap {
    margin-bottom: 24px;
  }
  h1 {
    font-size: 22px; 
    font-weight: 500; 
    color: #ffffff; 
    margin: 0 0 6px;
  }
  p { font-size: 13.5px; color: rgba(255, 255, 255, 0.65); margin: 0; }

  .err-msg {
    background: rgba(239, 68, 68, 0.15); 
    border: 1px solid rgba(239, 68, 68, 0.4); 
    color: #f87171; 
    padding: 12px 16px; 
    border-radius: 14px; 
    font-size: 13px; 
    font-weight: 600; 
    margin-bottom: 20px; 
    text-align: left;
  }

  .field { text-align: left; margin-bottom: 18px; }
  label { display: block; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.75); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  input {
    width: 100%; 
    padding: 12px 16px; 
    background: rgba(255, 255, 255, 0.07); 
    border: 1px solid rgba(255, 255, 255, 0.18); 
    border-radius: 14px; 
    font-family: 'Inter', sans-serif;
    font-size: 14px; 
    color: #ffffff; 
    transition: all 0.2s ease;
  }
  input::placeholder { color: rgba(255, 255, 255, 0.4); }
  input:focus { outline: none; border-color: #ff6600; background: rgba(255, 255, 255, 0.12); box-shadow: 0 0 16px rgba(255,102,0,0.3); }

  /* Translucent Glass Pill Submit Button */
  .btn-submit {
    width: 100%; 
    padding: 14px; 
    border-radius: 999px; 
    border: 1px solid rgba(255, 102, 0, 0.5); 
    background: #ff6600; 
    color: #ffffff;
    font-family: 'Inter', sans-serif; 
    font-size: 14.5px; 
    font-weight: 600; 
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(255,102,0,0.4); 
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); 
    margin-top: 10px;
  }
  .btn-submit:hover { background: #e05500; transform: scale(1.02); box-shadow: 0 12px 32px rgba(255,102,0,0.5); }
  .btn-submit:active { transform: scale(0.97); }
</style>
</head>
<body>
  <div class="login-card">
    <div class="brand-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>
    </div>

    <div class="title-wrap">
      <h1>Portal Admin <span class="font-playfair" style="font-style: italic;">RescueDrone</span></h1>
      <p>Silakan login untuk mengelola drone &amp; insiden SAR</p>
    </div>

    {% if error %}
    <div class="err-msg">⚠️ {{ error }}</div>
    {% endif %}

    <form method="POST" action="/admin/login">
      <div class="field">
        <label>Username Admin</label>
        <input type="text" name="username" placeholder="Masukkan username admin" required autofocus />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="Masukkan password" required />
      </div>
      <button type="submit" class="btn-submit">Masuk ke Dashboard Admin</button>
    </form>
  </div>
</body>
</html>
